# One-click deploy on Render (Blueprint). Other hosts: build services/smartquote/Dockerfile.
services:
  - type: web
    name: mechmetriq-smartquote
    runtime: docker
    rootDir: services/smartquote
    dockerfilePath: ./Dockerfile
    plan: standard       # 2 GB RAM. The parser needs ~450 MB per request; free/starter (512 MB) run out of memory
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: SMARTQUOTE_API_KEY
        sync: false      # set in the dashboard; same value as in Vercel
