# Deploy — staging
# Security note: In production operations, pin third-party actions (google-github-actions/auth,
# google-github-actions/setup-gcloud, docker/setup-buildx-action, docker/build-push-action,
# dorny/paths-filter, supabase/setup-cli) to full 40-char commit SHAs so a compromised action tag
# cannot access cloud deployment tokens. Dependabot (`github-actions` ecosystem) keeps SHAs updated.
name: Deploy — staging

on:
  push:
    branches: [staging]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  REGION: asia-south1

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Sync baseline migration history if schema already exists
        run: |
          HAS_PROFILES=$(psql "${{ secrets.SUPABASE_SESSION_POOLER_URL }}" -tAc "SELECT to_regclass('public.profiles') IS NOT NULL;" 2>/dev/null || echo "f")
          HAS_0001=$(psql "${{ secrets.SUPABASE_SESSION_POOLER_URL }}" -tAc "SELECT EXISTS (SELECT 1 FROM supabase_migrations.schema_migrations WHERE version = '0001');" 2>/dev/null || echo "f")
          if [ "$HAS_PROFILES" = "t" ] && [ "$HAS_0001" != "t" ]; then
            echo "Existing schema detected without CLI history for 0001..0022; marking 0001..0022 as applied..."
            for V in 0001 0002 0003 0004 0005 0006 0007 0008 0009 0010 0011 0012 0013 0014 0015 0016 0017 0018 0019 0020 0021 0022; do
              supabase migration repair --status applied "$V" --db-url "${{ secrets.SUPABASE_SESSION_POOLER_URL }}" --yes || true
            done
          fi
      - name: Show pending migrations (dry run)
        run: supabase db push --db-url "${{ secrets.SUPABASE_SESSION_POOLER_URL }}" --dry-run
      - name: Apply migrations (IPv4 session pooler)
        run: supabase db push --db-url "${{ secrets.SUPABASE_SESSION_POOLER_URL }}" --yes

  changes:
    runs-on: ubuntu-latest
    outputs:
      worker: ${{ steps.f.outputs.worker }}
    steps:
      - uses: actions/checkout@v4
      - id: f
        uses: dorny/paths-filter@v3
        with:
          filters: |
            worker:
              - 'services/smartquote/**'
              - '.github/workflows/deploy-staging.yml'

  build:
    needs: [migrate, changes]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: deployer@${{ vars.GCP_PROJECT }}.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker ${REGION}-docker.pkg.dev --quiet
      - uses: docker/setup-buildx-action@v3
      - name: Build & push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/mechonehub/web:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'https://staging.mechonehub.com' }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build & push worker image (only if changed)
        if: needs.changes.outputs.worker == 'true'
        uses: docker/build-push-action@v6
        with:
          context: services/smartquote
          push: true
          tags: ${{ env.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/mechonehub/cad-worker:${{ github.sha }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,scope=worker,mode=max

  deploy:
    needs: [build, changes]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: deployer@${{ vars.GCP_PROJECT }}.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy worker (if changed)
        if: needs.changes.outputs.worker == 'true'
        run: |
          gcloud run deploy mechonehub-cad-worker --region $REGION --project ${{ vars.GCP_PROJECT }} \
            --image $REGION-docker.pkg.dev/${{ vars.GCP_PROJECT }}/mechonehub/cad-worker:${{ github.sha }}
      - name: Deploy web as a tagged revision with NO traffic
        run: |
          TAG="sha-${GITHUB_SHA::7}"
          gcloud run deploy mechonehub-web --region $REGION --project ${{ vars.GCP_PROJECT }} \
            --image $REGION-docker.pkg.dev/${{ vars.GCP_PROJECT }}/mechonehub/web:${{ github.sha }} \
            --no-traffic --tag "$TAG"
          SVC=$(gcloud run services describe mechonehub-web --region $REGION --project ${{ vars.GCP_PROJECT }} \
            --format="value(status.url)")
          echo "CANDIDATE_URL=https://${TAG}---${SVC#https://}" >> $GITHUB_ENV
          echo "TAG=$TAG" >> $GITHUB_ENV
      - name: Health-check the candidate revision (/api/health is exempt from origin lock)
        run: curl --fail --retry 10 --retry-delay 3 --retry-all-errors "$CANDIDATE_URL/api/health"
      - name: Shift 100% traffic to the verified candidate
        run: |
          gcloud run services update-traffic mechonehub-web --region $REGION --project ${{ vars.GCP_PROJECT }} \
            --to-latest
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: env.CF_API_TOKEN != ''
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        with:
          node-version: 22
      - name: Sync ORIGIN_VERIFY_SECRET from GCP Secret Manager & Deploy Cloudflare Worker (staging)
        if: env.CF_API_TOKEN != ''
        working-directory: cloudflare-worker
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID || '90d6429ee3422c4c82d37f6eebfdfb61' }}
        run: |
          npx --yes wrangler@4 deploy --keep-vars -c wrangler.toml --env staging
          ORIGIN_SECRET=$(gcloud secrets versions access latest --secret=ORIGIN_VERIFY_SECRET --project="${{ vars.GCP_PROJECT }}" 2>/dev/null | tr -d '\r\n' || true)
          if [ -n "$ORIGIN_SECRET" ]; then
            printf "%s" "$ORIGIN_SECRET" | npx --yes wrangler@4 secret put ORIGIN_VERIFY_SECRET -c wrangler.toml --env staging
          fi
